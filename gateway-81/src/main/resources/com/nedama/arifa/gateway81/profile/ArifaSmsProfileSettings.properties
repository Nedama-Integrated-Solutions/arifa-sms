Category.AfricasTalking=Africa\u2019s Talking Account
Category.Delivery=Delivery
Category.TwoWay=Two-Way Acknowledgement
Category.Auditing=Auditing

Username.Name=Username
Username.Desc=The username of your Africa\u2019s Talking app. Only used when Live is on, because the sandbox always uses the username "sandbox".

ApiKey.Name=API Key
ApiKey.Desc=The API key of your Africa\u2019s Talking app. It is stored encoded in the gateway and is never written to the logs.

UseLiveEnvironment.Name=Live
UseLiveEnvironment.Desc=Off: messages go to the Africa\u2019s Talking sandbox simulator and nothing is billed. On: real SMS are sent to real phones and billed by Africa\u2019s Talking.

SenderId.Name=Sender ID
SenderId.Desc=Optional. The registered sender name or shortcode shown on the phone. Leave blank to use the default sender. Replies can only be received through a shortcode.

DefaultCountryCode.Name=Default Country Code
DefaultCountryCode.Desc=Digits only. Used for numbers typed without a country code, such as 0712 345 678. Blank means 254 (Kenya).

TimeoutSeconds.Name=Request Timeout (seconds)
TimeoutSeconds.Desc=How long to wait for Africa\u2019s Talking to answer before giving up. Blank means 10. Arifa retries once after a temporary failure.

AuditProfile.Name=Audit Profile
AuditProfile.Desc=If an audit profile is selected, alarm notifications are stored in the audit system. Alarm acknowledgements are also stored in the alarm journal.


MaxSmsPerHour.Name=Maximum SMS per Hour
MaxSmsPerHour.Desc=A safety cap on cost. No more than this many SMS are sent in any rolling 60 minutes, counting one SMS part to one person as one. A message of 2 parts to 3 people counts as 6. When the cap is reached nothing more is sent, the profile status shows the limit, and Arifa reports the notification to Ignition as failed. Blank means 100. 0 means no limit.

ExpectedCurrency.Name=Expected Cost Currency
ExpectedCurrency.Desc=The currency your SMS should be billed in, for example KES. If Africa\u2019s Talking reports a cost in another currency, which can mean a message was billed as international traffic, Arifa writes a warning to the log. Blank means KES.

TwoWayEnabled.Name=Allow Acknowledgement by SMS Reply
TwoWayEnabled.Desc=On: each alarm SMS ends with a line such as "Reply NEDAMA 4821 to ack". When the operator replies with that code from their own phone, the alarm is acknowledged in Ignition as that user. Replies are read by polling Africa\u2019s Talking, so the gateway does not need to be reachable from the internet. Needs a shortcode, entered above as the Sender ID. Codes are kept in memory only, so replies to messages sent before a gateway restart or failover are ignored.

AckKeyword.Name=Reply Keyword
AckKeyword.Desc=The word the operator types before the code, for example NEDAMA 4821. Letters only, up to 12. Blank means NEDAMA. To use no keyword at all, for example on a dedicated shortcode, type a single dash (-); the operator then replies with just the code. With a shared shortcode this must be the keyword registered with Africa\u2019s Talking.

AckValidMinutes.Name=Code Valid For (minutes)
AckValidMinutes.Desc=How long a reply can still acknowledge the alarm after the SMS was sent. Blank means 60.

PollSeconds.Name=Check for Replies Every (seconds)
PollSeconds.Desc=How often to ask Africa\u2019s Talking for new replies while a code is waiting. Nothing is requested when no code is waiting. Blank means 10. Lower is quicker but makes more requests.

SendConfirmation.Name=Send Confirmation SMS
SendConfirmation.Desc=On: the operator gets a short SMS saying whether the acknowledgement worked. This costs one extra SMS per reply.
